<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPT 月报</title>
<style>
:root{--ink:#133e66;--muted:#5d6b7a;--line:#dde3ea;--bg:#f7f5f1;--card:#fff;--blue:#1a6daa;--ok:#1e7b4a;--warn:#a35a00;--bad:#b42318}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:#1f2933;font-size:14px;line-height:1.6}
header{background:var(--ink);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:18px}
header h1{font-size:18px;margin:0;font-weight:600}
header a{color:#cfe3f5;font-size:13px;margin-left:auto}
main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:20px}
h2{font-size:16px;margin:0 0 4px;color:var(--ink)}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select{font:inherit;padding:7px 10px;border:1px solid #c6ced8;border-radius:6px;background:#fff;color:#1f2933;min-width:180px}
input[type=file]{padding:5px;min-width:260px}
button,.button{font:inherit;padding:7px 16px;border-radius:6px;border:1px solid #c6ced8;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.small{padding:4px 11px;font-size:13px}
.cards{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h3{margin:0 0 4px;font-size:15px}
.meta{color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;margin-right:6px}
.tag.ok{background:#e3f4ea;color:var(--ok)}.tag.warn{background:#fdf0dc;color:var(--warn)}.tag.bad{background:#fde8e6;color:var(--bad)}.tag.gray{background:#eef1f4;color:var(--muted)}
.actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
.status{margin-top:14px;padding:12px 14px;border-radius:8px;background:#f2f6fa;display:none}
.status.show{display:block}
.error{color:var(--bad)}
details{margin-top:6px}summary{cursor:pointer;color:var(--blue);font-size:13px}
ul.notes{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:8px 0}
</style>
</head>
<body>
<header><h1>PPT 月报</h1><span style="opacity:.75;font-size:13px">模板就是 PPT 文件，生成结果直接是可编辑 PPTX</span><a href="/#templates">返回工作台模板库</a></header>
<main>
  <section id="generate">
    <h2>生成 PPT</h2>
    <p class="hint">选模板和月份。小游戏模板会自动从小游戏接口取当月和上月数据；Steam 模板需要上传当月数据包和时间窗口审计。</p>
    <div class="row">
      <label>模板<select id="genTemplate"></select></label>
      <label>月份<input id="genMonth" type="month"></label>
      <label id="dataLabel" hidden>当月数据包 JSON<input id="genData" type="file" accept=".json,application/json"></label>
      <label id="auditLabel" hidden>时间窗口审计 JSON<input id="genAudit" type="file" accept=".json,application/json"></label>
      <button class="primary" id="generate">生成 PPT</button>
    </div>
    <div class="status" id="genStatus"></div>
  </section>

  <section id="templatesSection">
    <h2>PPT 模板</h2>
    <p class="hint">上传一份 PPTX 作为模板。已登记过填数规则的 PPT 会自动带上规则；请先下载原稿在 PowerPoint 里核对，再点“发布”。</p>
    <div class="cards" id="templates"></div>
    <details style="margin-top:14px"><summary>上传新的 PPT 模板</summary>
      <div class="row" style="margin-top:10px">
        <label>PPTX 文件<input id="upFile" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation"></label>
        <label>模板名称<input id="upTitle" maxlength="120" placeholder="例如：小游戏月报"></label>
          <label>数据源<select id="upSource"><option value="minigame-monthly">小游戏月报接口</option><option value="steamauto">SteamAuto 月报数据</option></select></label>
        <button id="upload">上传</button>
      </div>
      <div class="status" id="upStatus"></div>
    </details>
  </section>

  <section>
    <h2>最近生成</h2>
    <div id="drafts"></div>
  </section>
</main>
<script src="/ui/ppt.js"></script>
</body>
</html>
