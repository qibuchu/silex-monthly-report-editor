<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可视化配置规则 · 月报工作台</title><link rel="stylesheet" href="/ui/visual-rules.css">
<header><a href="/#templates">← 模板库</a><div><h1 id="title">模板编辑与规则配置</h1><small id="version">正在读取模板…</small></div><div class="toolbar"><a id="layoutLink" target="_blank" rel="noopener" title="在独立窗口打开编辑器">独立打开 ↗</a><a id="sourceLink">导入数据</a><button id="connectAI">AI 修改说明</button><button id="save">保存规则草稿</button><button id="preview">预览填充</button><button id="publish" class="primary">发布模板</button></div></header>
<main id="workbench"><aside class="pages"><h2>页面</h2><div id="pages"></div><h2 id="reviewCount">待确认对象</h2><div id="reviews"></div><p>在版式编辑中选中对象，右侧直接设置规则；表格单元格按整块表格处理。</p></aside><section class="workspace"><div class="canvas-tools"><span id="pageTitle"></span><div class="view-switch"><button type="button" id="editLayout" class="active">版式编辑</button><button type="button" id="markRules">规则标注</button></div><div id="zoomTools"><button type="button" id="zoomOut" aria-label="缩小画布">−</button><button type="button" id="zoomFit">适合窗口</button><button type="button" id="zoomIn" aria-label="放大画布">＋</button></div><span id="legend"><b class="auto">自动数据</b><b class="static">固定内容</b><b class="blank">人工留空</b></span></div><iframe id="layoutFrame" title="模板版式编辑器" loading="eager"></iframe><div id="viewport"><div id="canvas"><div id="surface"><iframe id="pageFrame" title="模板原页预览" sandbox="" loading="eager"></iframe><div id="overlay"></div></div></div></div><div id="status" role="status"></div><div id="result" hidden></div></section><aside class="inspector"><h2>选中对象的规则</h2><div id="inspector"><p>在画布上选择对象。</p></div></aside></main>
<dialog id="publishDialog"><form method="dialog"><h2>发布当前规则</h2><p>发布后，新生成的草稿使用这份页面、对象和数据字段规则。已有月报不变。</p><label><input id="reviewed" type="checkbox"> 已核对预览中的版式、数据窗口、缺失字段和待确认项</label><div class="toolbar"><button value="cancel">返回检查</button><button id="confirmPublish" class="primary" value="publish">确认发布</button></div></form></dialog>
<dialog id="aiDialog"><h2>在 WorkBuddy 中修改模板</h2><p>WorkBuddy 只需在“AI 与设置”中连接一次。此页点选页面、文字、图片或表格后，回到同一个聊天描述修改；无需为当前模板重新添加 MCP。规则修改同步到此页，文字与样式修改同步到模板编辑稿。</p><label>全局 MCP 地址<input id="aiEndpoint" readonly></label><label>Codex 备用接入命令<input id="aiCommand" readonly></label><label>修改说明<textarea id="aiPrompt" readonly rows="7"></textarea></label><div class="toolbar"><a href="/#settings">查看 WorkBuddy 全局设置</a><button id="copyAiPrompt" type="button">复制说明</button><button id="closeAI" type="button">关闭</button></div></dialog>
<script src="/ui/visual-rules.js" defer></script></html>
